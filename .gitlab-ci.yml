workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

stages:
  - validate
  - publish

default:
  image: alpine:3.20
  interruptible: true

variables:
  MCP_PUBLISHER_VERSION: "v1.8.1"
  REGISTRY_VERSIONS_URL: "https://registry.modelcontextprotocol.io/v0/servers/io.sparkletree%2Fsparkletree/versions"
  GIT_DEPTH: "50"

# Manifests, versions, layout (scripts/ci-validate.sh), then: did the plugin
# version move when user-visible files changed, and never backwards
# (scripts/ci-check-bump.sh). Every push.
validate:
  stage: validate
  script:
    - apk add --no-cache jq git >/dev/null
    - sh scripts/ci-validate.sh
    - sh scripts/ci-check-bump.sh

# The real plugin validator. Non-blocking until it has run green on main a few
# times; then drop allow_failure.
validate-plugin-cli:
  stage: validate
  image: node:22-alpine
  allow_failure: true
  script:
    - npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
    - claude plugin validate --strict .
    - claude plugin validate --strict skills
    - claude plugin validate --strict agents

# plugin-v<version> on the main commit that carries it. Idempotent.
tag-plugin:
  stage: publish
  needs:
    - validate
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - apk add --no-cache curl jq >/dev/null
    - VERSION=$(jq -r .version .claude-plugin/plugin.json)
    - sh scripts/ci-tag.sh "plugin-v$VERSION" "SparkleTree plugin $VERSION"

# Publish server.json to the official MCP registry when its version is ahead of
# the registry, refuse when it is behind or reused, then tag server-v<version>.
publish-registry:
  stage: publish
  needs:
    - validate
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - apk add --no-cache curl jq openssl >/dev/null
    - VERSION=$(jq -r .version server.json)
    - LATEST=$(curl -fsS --retry 3 "$REGISTRY_VERSIONS_URL" | jq -r '.servers[] | select(._meta["io.modelcontextprotocol.registry/official"].isLatest == true) | .server.version')
    - PUBLISHED=$(curl -fsS --retry 3 "$REGISTRY_VERSIONS_URL" | jq -r '.servers[].server.version')
    - echo "server.json $VERSION; registry latest $LATEST"
    - '[ -n "${MCP_REGISTRY_ED25519_KEY_B64:-}" ] || { echo "CI variable MCP_REGISTRY_ED25519_KEY_B64 is not set (Settings > CI/CD > Variables, protected + masked)"; exit 1; }'
    - curl -fsSL --retry 3 "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
    - echo "$MCP_REGISTRY_ED25519_KEY_B64" | base64 -d > /tmp/key.pem
    - PRIVATE_KEY=$(openssl pkey -in /tmp/key.pem -noout -text | grep -A3 'priv:' | tail -n +2 | tr -d ' :\n')
    - rm -f /tmp/key.pem
    - ./mcp-publisher login http --domain sparkletree.io --private-key "$PRIVATE_KEY"
    - PRIVATE_KEY=""
    - |
      if [ "$VERSION" = "$LATEST" ]; then
        echo "registry already at $VERSION; nothing to publish"
      else
        if echo "$PUBLISHED" | grep -qx "$VERSION"; then
          echo "server.json $VERSION is already published but is not the latest ($LATEST); bump server.json past $LATEST"
          exit 1
        fi
        if [ "$(sh scripts/semver-cmp.sh "$VERSION" "$LATEST")" = "-1" ]; then
          echo "server.json $VERSION is behind the registry's latest $LATEST; bump server.json past $LATEST"
          exit 1
        fi
        ./mcp-publisher publish
        sleep 5
        NOW=$(curl -fsS --retry 3 "$REGISTRY_VERSIONS_URL" | jq -r '.servers[] | select(._meta["io.modelcontextprotocol.registry/official"].isLatest == true) | .server.version')
        [ "$NOW" = "$VERSION" ] || { echo "published, but the registry reports latest $NOW, expected $VERSION"; exit 1; }
        echo "published io.sparkletree/sparkletree $VERSION"
      fi
    - sh scripts/ci-tag.sh "server-v$VERSION" "SparkleTree MCP server $VERSION in the official MCP registry"
