# The CI definition lives in the SparkleTree monorepo and runs here, in this
# project, with this project's CI variables. It validates every push, and on
# main tags the plugin version and publishes server.json to the MCP registry.
include:
  - project: sparkletree/sparkletree-project
    ref: main
    file: /docs/plugin-submissions/plugin-ci/gitlab-ci.yml
